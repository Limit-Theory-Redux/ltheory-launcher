[package]
name = "ltheory_redux_launcher"
version = "0.6.1"
description = ""
authors = ["IllustrisJack"]
repository = "https://github.com/Limit-Theory-Redux/ltheory-launcher"
edition = "2021"
rust-version = "1.72"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
dirs = "6"
winapi = { version = "0.3.9", features = ["minwindef", "windef", "winbase", "winuser"] }
winreg = "0.52"
reqwest = { version = "0.12.3", features = ["stream"] }
futures-util = "0.3.14"
zip = "2.1.1"
tokio = "1.34"
tempfile = "3"
minisign-verify = "0.2.5"
tauri-plugin-clipboard-manager = "^2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# File size optimizations
[profile.release]
strip = true # Automatically strip symbols from the binary.
lto = true
